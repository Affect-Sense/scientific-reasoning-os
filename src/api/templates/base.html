<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scientific Reasoning OS{% endblock %}</title>
  <style>
    :root { --ink:#1a1a2e; --accent:#0f4c81; --ok:#2e7d32; --warn:#b26a00; --bad:#b3261e; --paper:#fafafa; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
           background: var(--paper); margin: 0; padding: 1.5rem; line-height: 1.55; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.35rem; } h2 { font-size: 1.05rem; margin-top: 1.8rem; }
    .brand { color: var(--accent); font-weight: 700; letter-spacing: .02em; }
    .beta { font-size:.7rem; background:var(--accent); color:#fff; border-radius:4px; padding:2px 6px; vertical-align:middle; }
    textarea, input[type=text] { width: 100%; padding: .6rem; border: 1px solid #c8c8d0;
                                 border-radius: 6px; font: inherit; }
    textarea { min-height: 7rem; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
             padding: .6rem 1.2rem; font: inherit; cursor: pointer; margin-top: .6rem; }
    button.secondary { background: #555; }
    .card { background: #fff; border: 1px solid #e3e3ea; border-radius: 8px;
            padding: 1rem 1.2rem; margin: .8rem 0; }
    .sev { font-size:.72rem; font-weight:700; border-radius:4px; padding:2px 8px; color:#fff; }
    .sev-ok { background: var(--ok); } .sev-minor { background: var(--warn); }
    .sev-major, .sev-blocking { background: var(--bad); }
    .status { font-weight: 700; }
    .status-validated { color: var(--ok); } .status-awaiting_revision { color: var(--warn); }
    .status-ready_for_validation { color: var(--accent); }
    .muted { color: #666; font-size: .88rem; }
    .lineage { border-left: 3px solid var(--accent); padding-left: .9rem; margin: .5rem 0; }
    ul { padding-left: 1.2rem; }
    .notice { background:#fff8e6; border:1px solid #e8d59a; border-radius:6px; padding:.6rem .9rem; font-size:.9rem; }
    .help { color:#555; font-size:.85rem; margin:-.4rem 0 .6rem; }
    .next { background:#eef6ee; border:1px solid #bcd8bc; border-radius:8px; padding:1rem 1.2rem; margin:1rem 0; }
    #busy { display:none; position:fixed; inset:0; background:rgba(255,255,255,.92); z-index:9; }
    #busy .inner { max-width:420px; margin:35vh auto; text-align:center; }
    .spin { width:34px; height:34px; border:4px solid #d8d8e0; border-top-color:var(--accent);
            border-radius:50%; margin:0 auto 1rem; animation:r 1s linear infinite; }
    @keyframes r { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div id="busy"><div class="inner"><div class="spin"></div>
  <p><strong>{{ t.busy_title }}</strong><br>
  <span class="muted">{{ t.busy_body }}</span><br>
  <span class="muted"><span id="elapsed">0</span> s</span></p>
</div></div>
<main>
  <header style="display:flex;align-items:baseline;gap:.7rem;border-bottom:2px solid var(--accent);padding-bottom:.6rem;margin-bottom:1.1rem;">
    <span style="font-weight:800;font-size:1.25rem;color:var(--accent);letter-spacing:.01em;">AffectSense</span>
    <span class="brand">Scientific Reasoning OS</span> <span class="beta">BETA</span>
    <span style="margin-left:auto;font-size:.85rem;">
      <a href="?k={{ k }}&lang={{ other_lang }}" style="color:var(--accent);text-decoration:none;">🌐 {{ t.lang_toggle }}</a>
    </span>
  </header>
  <p class="muted" style="margin-top:-0.6rem"><em>{{ t.strapline }}</em></p>
  {% block content %}{% endblock %}
  <footer class="muted" style="border-top:1px solid #e3e3ea;margin-top:2.2rem;padding-top:.7rem;font-size:.82rem;">
    {{ t.footer }}
  </footer>
</main>
<script>
  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (f.dataset.busy === "critique") {
      document.getElementById("busy").style.display = "block";
      var b = f.querySelector("button"); if (b) { b.disabled = true; }
      var el = document.getElementById("elapsed"), n = 0;
      setInterval(function () { n += 1; if (el) { el.textContent = n; } }, 1000);
    }
  });
</script>
</body>
</html>
